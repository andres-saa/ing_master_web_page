version: '3.9'
services:
  # api_socket:
  #   build: { context: ./backend/socket, target: dev }
  #   container_name: ing_master_webp_api_socket_dev
  #   env_file: ./backend/socket/.env
  #   volumes:
  #     - ./backend/socket/app:/code
  #   environment:
  #     CHOKIDAR_USEPOLLING: "true"
  #   ports:
  #     - '8000:80'
  #   restart: unless-stopped

  front_web:
    build: { context: ./frontend/web, target: dev }
    container_name: ing_master_webp_front_web_dev
    volumes:
      - ./frontend/web/app:/app
      - front_web_node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
    env_file: ./frontend/web/.env
    command: npm run dev -- --host 0.0.0.0
    ports:
      - '3000:3000'
    restart: unless-stopped

  # === NUEVO SERVICIO: PAGINA ===
  front_pagina:
    build: { context: ./frontend/pagina, target: dev }
    container_name: ing_master_webp_front_pagina_dev
    volumes:
      - ./frontend/pagina/app:/app
      # Importante: Un volumen propio para node_modules
      - front_pagina_node_modules:/app/node_modules 
    environment:
      CHOKIDAR_USEPOLLING: "true"
    # Asegúrate de tener un .env en esta carpeta también
    env_file: ./frontend/pagina/.env 
    command: npm run dev -- --host 0.0.0.0
    ports:
      # Puerto Host : Puerto Contenedor
      - '3001:3000' 
    restart: unless-stopped

volumes:
  front_web_node_modules:
  front_pagina_node_modules: # Volumen nuevo agregado